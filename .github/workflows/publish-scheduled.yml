name: Publish scheduled posts

# The site is prerendered, so a post dated in the future only goes live when
# the site is rebuilt on or after that date. This rebuilds production on the
# morning a post is due.
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      slugs: ${{ steps.due.outputs.slugs }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Find posts due today
        id: due
        run: |
          slugs=$(node scripts/posts-due.mjs | paste -sd, -)
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"
          echo "Due today: ${slugs:-none}"

  deploy:
    needs: check
    if: needs.check.outputs.slugs != '' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/deploy.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
