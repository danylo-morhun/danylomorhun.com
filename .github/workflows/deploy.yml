name: Deploy

# Builds the prerendered site and ships it to the Cloudflare Worker (wrangler.jsonc).
# Runs after CI passes on main, by hand, or from publish-scheduled.yml when a post is due.

on:
  workflow_run:
    workflows: [CI Pipeline]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://www.danylomorhun.com
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Smoke test
        run: |
          sleep 5
          fail=0
          for url in https://www.danylomorhun.com/ https://www.danylomorhun.com/uk https://www.danylomorhun.com/work/grx-pay \
                     https://www.danylomorhun.com/blog https://www.danylomorhun.com/sitemap_index.xml; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url")
            echo "$code $url"
            [ "$code" = 200 ] || fail=1
          done
          exit $fail
