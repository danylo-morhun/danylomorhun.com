version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      nuxt:
        patterns: ['nuxt', '@nuxt/*', '@nuxtjs/*', 'nuxt-*', 'vue', 'vue-*', '@vue/*']
      tooling:
        dependency-type: development
    ignore:
      # vue-tsc can't load TypeScript 7 yet (ERR_PACKAGE_PATH_NOT_EXPORTED).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
